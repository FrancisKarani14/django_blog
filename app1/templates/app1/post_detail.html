{%extends 'base.html'%}

{%block content%}
    <h2>Blog Posts</h2>
    <ul>
        {% for post in posts %}
            <li>
                <h3>{{ post.title }}</h3>
                <p>{{ post.content }}</p>
                <p><em>Posted on {{ post.created_at }}</em></p>
                <a href="{%app1/post_update.html%}">edit</a>
                <a href="{%app1/post_confirm_delete.html%}">delete</a>
            </li>
        {% empty %}
            <li>No posts available.</li>
        {% endfor %}
    </ul>
{% endblock %}
{% endblock
