{%extends 'base.html'%}

{%block content%}
    <h2>Blog Posts</h2>
    <ul>
        {% for post in posts %}
            <li>
                <h3>{{ post.title }}</h3>
                <p>{{ post.content|truncatewords:50 }}</p>
                <a href="{% url 'app1/post_detail' post.id %}">read more...</a>
                <p><em>Posted on {{ post.created_at }}</em></p>
            </li>
        {% empty %}
            <li>No posts available.</li>
        {% endfor %}
    </ul>
{%endblock%}
{% endblock %}
